[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "scopecheck"
version = "0.1.0"
description = "Synthetic LLM tool authorization sandbox — application foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
]

[project.scripts]
scopecheck = "scopecheck.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: isolated, keyless checks without external services",
  "integration: checks requiring real external infrastructure",
  "e2e: checks exercising a deployed application end to end",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
