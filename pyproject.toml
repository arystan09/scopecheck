[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "scopecheck"
version = "0.1.0"
description = "Synthetic LLM tool authorization sandbox and offline evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "jinja2>=3.1.6,<4",
  "openai==3.49.0",
  "httpx2==2.16.0",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "prometheus-client>=0.21,<1",
]

[project.scripts]
scopecheck = "scopecheck.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: isolated, keyless checks without external services",
  "integration: checks requiring real external infrastructure",
  "e2e: checks exercising a deployed application end to end",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["work", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.sdist]
# Keep ignored local artifacts out even when a nested .env.example is unignored.
exclude = ["/work/**", "/outputs/**"]

[tool.hatch.build.targets.wheel.force-include]
"datasets" = "scopecheck/data"

[tool.coverage.run]
branch = true
source = ["scopecheck"]

[tool.coverage.report]
precision = 2
