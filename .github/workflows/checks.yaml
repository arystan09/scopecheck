name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scopecheck
          POSTGRES_DB: scopecheck
          # Isolated disposable CI service only; Compose requires a password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scopecheck -d scopecheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Install recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen --all-groups
      - run: make check
      - name: Migrations and real PostgreSQL integration tests
        env:
          SCOPECHECK_DATABASE_URL: postgresql+psycopg://scopecheck@127.0.0.1:5432/scopecheck
          SCOPECHECK_TEST_ADMIN_URL: postgresql+psycopg://scopecheck@127.0.0.1:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run pytest --cov=scopecheck --cov-branch --cov-report=term-missing
          uv run coverage json -o coverage.json
          uv run python scripts/check_core_coverage.py coverage.json
      - name: Validate Compose, build, and test the non-root container
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          make container-check
          export GHCR_REPOSITORY=example/scopecheck
          export IMAGE_SHA256="$(printf 'a%.0s' {1..64})"
          export DEMO_DOMAIN=example.invalid ACME_EMAIL=owner@example.invalid
          uv run python scripts/check-production.py
          docker compose -f deploy/compose.production.yaml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile

      - name: Compose API/worker demo and package parity
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export SCOPECHECK_DB_PORT=55432
          export SCOPECHECK_DATABASE_URL="postgresql+psycopg://scopecheck:${POSTGRES_PASSWORD}@127.0.0.1:55432/scopecheck"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps --all || true
              docker compose logs --no-color --tail 100 app worker migrate db || true
            fi
            docker compose down --volumes || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --build -d
          # A published port can reset connections before Uvicorn starts listening.
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --max-time 2 --retry-max-time 45 http://127.0.0.1:8000/health/ready
          uv run python scripts/demo_smoke.py
          test "$(docker compose exec -T app scopecheck --version)" = "$(uv run scopecheck --version)"
          test "$(docker compose exec -T worker scopecheck --version)" = "$(uv run scopecheck --version)"
