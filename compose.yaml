services:
  app:
    build: .
    image: scopecheck:local
    ports:
      - "127.0.0.1:${SCOPECHECK_HTTP_PORT:-8000}:8000"
    environment:
      SCOPECHECK_COLLECTOR: ${SCOPECHECK_COLLECTOR:-disabled}
      SCOPECHECK_MODE: fake
      SCOPECHECK_PUBLIC_DEMO: ${SCOPECHECK_PUBLIC_DEMO:-false}
      SCOPECHECK_DATABASE_URL: postgresql+psycopg://scopecheck:${POSTGRES_PASSWORD:?Set a generated local POSTGRES_PASSWORD}@db:5432/scopecheck
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: scopecheck:local
    build: .
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment:
      SCOPECHECK_DATABASE_URL: postgresql+psycopg://scopecheck:${POSTGRES_PASSWORD:?Set a generated local POSTGRES_PASSWORD}@db:5432/scopecheck
    depends_on:
      collector:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
  db:
        condition: service_healthy
  worker:
    image: scopecheck:local
    build: .
    command: ["scopecheck", "worker"]
    healthcheck:
      disable: true
    environment:
      SCOPECHECK_COLLECTOR: ${SCOPECHECK_COLLECTOR:-disabled}
      SCOPECHECK_PUBLIC_DEMO: ${SCOPECHECK_PUBLIC_DEMO:-false}
      SCOPECHECK_DATABASE_URL: postgresql+psycopg://scopecheck:${POSTGRES_PASSWORD:?Set a generated local POSTGRES_PASSWORD}@db:5432/scopecheck
    depends_on:
      migrate:
        condition: service_completed_successfully
  db:
    image: postgres:18
    ports:
      - "127.0.0.1:${SCOPECHECK_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: scopecheck
      POSTGRES_USER: scopecheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated local POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopecheck -d scopecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
